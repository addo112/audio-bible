<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="Asante Twi Audio Bible - Tie Onyame Asɛm wɔ Twi mu">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Asante Twi Audio Bible</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- ========== SCREEN 1: LANGUAGE SELECTION ========== -->
    <div id="screen-language" class="screen active">
        <div class="language-header">
            <!-- Bible Icon -->
            <div class="app-icon">
                <svg viewBox="0 0 100 100" width="80" height="80">
                    <rect x="15" y="10" width="70" height="80" rx="5" fill="#8B4513" stroke="#5C3317" stroke-width="2"/>
                    <rect x="20" y="15" width="60" height="70" rx="3" fill="#F5E6C8"/>
                    <line x1="50" y1="30" x2="50" y2="65" stroke="#8B4513" stroke-width="3"/>
                    <line x1="35" y1="47" x2="65" y2="47" stroke="#8B4513" stroke-width="3"/>
                    <rect x="18" y="10" width="8" height="80" rx="2" fill="#6B3410"/>
                </svg>
            </div>
            <h1 class="app-title">Audio Bible</h1>
            <p class="app-subtitle">📖 ✝️ 🔊</p>
        </div>
        
        <div class="language-grid" id="language-grid">
            <!-- Language buttons are generated by JavaScript -->
        </div>
        
        <div class="language-footer">
            <div class="footer-icons">🙏 📖 ✝️ ❤️</div>
        </div>
    </div>

    <!-- ========== SCREEN 2: VOICE INTERACTION ========== -->
    <div id="screen-voice" class="screen">
        <!-- Top Bar with language indicator and back button -->
        <div class="voice-topbar" id="voice-topbar">
            <button class="back-btn" id="btn-back" aria-label="Go back" style="display: none;">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="white">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </button>
            <div class="current-language" id="current-language">
                <span class="lang-flag" id="lang-flag"></span>
                <span class="lang-name" id="lang-name"></span>
            </div>
        </div>

        <!-- Status Area -->
        <div class="status-area" id="status-area">
            <div class="status-icon" id="status-icon">📖</div>
            <div class="status-text" id="status-text"></div>
        </div>

        <!-- Response / Conversation Area -->
        <div class="conversation-area" id="conversation-area">
            <div class="welcome-message" id="welcome-message">
                <!-- Welcome message shown initially -->
            </div>
            <div class="messages" id="messages">
                <!-- Chat messages appear here -->
            </div>
        </div>

        <!-- Audio Player (for playing responses) -->
        <div class="audio-player" id="audio-player" style="display: none;">
            <button class="play-btn" id="btn-play-response" aria-label="Play response">
                <svg viewBox="0 0 24 24" width="40" height="40" fill="white">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>
            <div class="audio-progress" id="audio-progress">
                <div class="audio-progress-bar" id="audio-progress-bar"></div>
            </div>
            <button class="stop-btn" id="btn-stop-response" aria-label="Stop">
                <svg viewBox="0 0 24 24" width="30" height="30" fill="white">
                    <path d="M6 6h12v12H6z"/>
                </svg>
            </button>
        </div>

        <!-- Microphone Button (Main Action) -->
        <div class="mic-container">
            <div class="mic-ripple" id="mic-ripple"></div>
            <button class="mic-btn" id="btn-mic" aria-label="Speak to Bible Teacher">
                <svg viewBox="0 0 24 24" width="48" height="48" fill="white" id="mic-icon">
                    <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                </svg>
                <!-- Loading spinner (shown during processing) -->
                <div class="spinner" id="mic-spinner" style="display: none;">
                    <div class="spinner-circle"></div>
                </div>
            </button>
            <div class="mic-label" id="mic-label"></div>
        </div>
    </div>

    <!-- ========== AUDIO ELEMENTS ========== -->
    <audio id="response-audio" preload="none"></audio>

    <!-- ========== OFFLINE BANNER ========== -->
    <div class="offline-banner" id="offline-banner" style="display: none;">
        <span>📵</span> No Internet
    </div>

    <!-- JavaScript -->
    <script src="/static/js/app.js"></script>
</body>
</html>
